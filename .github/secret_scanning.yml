# Paths excluded from GitHub's secret scanning.
#
# EnvLeak is a secret scanner, so its own repository is full of credential-
# shaped strings on purpose: the rule catalogue's examples, the adversarial
# false-positive corpus, the synthetic history builder and the test fixtures.
# Every one of them is fabricated and none was ever valid — see SECURITY.md.
#
# Without this file GitHub reports each of them as a leaked credential, and
# push protection refuses the push outright.
#
# This list mirrors the `allowlist.paths` section of .envleak.yml: the same
# files EnvLeak refuses to scan in itself are the ones GitHub should skip.
# Everything outside it — every non-test Go file, every workflow, every config
# — is still scanned, so a genuine leak would still be caught.
paths-ignore:
  - "testdata/**"
  - "internal/rules/rules.yaml"
  - "internal/testcorpus/**"
  - "**/*_test.go"
  - "hack/mkdemo.py"
  - "docs/**"
  - "README.md"
