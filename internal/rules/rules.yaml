  # ----------------------------------------------------------- Generic ------
  - id: generic-env-secret
    description: Environment-style assignment whose name looks like a secret
    severity: medium
    confidence: medium
    keywords: [secret, token, password, passwd, apikey, api_key, access_key, private_key, credential]
    # The name must be SHOUTING_SNAKE: this rule is about .env files and
    # shell exports. Mixed-case assignments are a different shape and are
    # covered, with a much higher entropy bar, by generic-assignment-secret.
    regex: '(?m)^\s*(?:export\s+)?[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|PASSWD|APIKEY|API_KEY|ACCESS_KEY|PRIVATE_KEY|CREDENTIAL)[A-Z0-9_]*\s*=\s*["\x27]?([^"\x27\s#]{12,})'
    secret_group: 1
    entropy_threshold: 3.5
    tags: [generic, env]
    examples:
      positive:
        - 'SERVICE_API_TOKEN=kR7mQz2XvNb8LcYt4WpJd6Sg'
      negative:
        - 'SERVICE_API_TOKEN=$SERVICE_API_TOKEN'
        - 'SERVICE_API_TOKEN=your-api-key-here'

  - id: generic-assignment-secret
    description: Code assignment of a high-entropy literal to a secret-like name
    severity: medium
    confidence: low
    keywords: [secret, token, password, passwd, apikey, api_key, credential, auth_key]
    regex: '(?i)\b(?:secret|token|password|passwd|api[_\-]?key|credential|auth[_\-]?key)[A-Za-z0-9_]*["\x27]?\s*[:=]\s*["\x27]([^"\x27\s]{16,})["\x27]'
    secret_group: 1
    entropy_threshold: 4.0
    tags: [generic, code]
    examples:
      positive:
        - 'const apiKey = "kR7mQz2XvNb8LcYt4WpJd6SgHa1F"'
      negative:
        - 'const apiKey = "aaaaaaaaaaaaaaaaaaaaaaaa"'
        - 'const apiKey = process.env.API_KEY'
